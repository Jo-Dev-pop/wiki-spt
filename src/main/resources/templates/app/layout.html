<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wiki-SPT</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar">
        <div>
            <div class="logo">
                <img th:src="@{/images/logo-poste.png}" width="70">
                <h4>Wiki-SPT</h4>
            </div>
            <nav>
                <a class="sidebar-link" th:href="@{/app/accueil}">
                    <i class="bi bi-house-fill"></i> Accueil
                </a>
                <a class="sidebar-link" th:href="@{/app/articles}">
                    <i class="bi bi-journal-text"></i> Articles
                </a>
                <a class="sidebar-link"
                   th:href="@{/app/articles/nouveau}" th:if="${utilisateurConnecte.role.name() == 'CONTRIBUTEUR'}">
                    <i class="bi bi-plus-circle"></i> Nouvel article
                </a>
            </nav>
        </div>
        <div>
            <hr>
            <p class="text-white mb-1"
               th:text="${utilisateurConnecte.prenom} + ' ' + ${utilisateurConnecte.nom}">Nom</p>
            <small class="text-white-50" th:text="${utilisateurConnecte.role}">RÔLE</small>
            <form class="mt-2" method="post" th:action="@{/logout}">
                <button class="btn btn-warning w-100">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </button>
            </form>
        </div>
    </aside>
    <main class="content">
        <div th:replace="${content}"></div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
