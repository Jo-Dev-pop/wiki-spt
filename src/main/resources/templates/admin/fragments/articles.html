<div class="alert alert-success alert-dismissible fade show" th:if="${success}">
    <span th:text="${success}"></span>
    <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
</div>
<div class="alert alert-danger alert-dismissible fade show" th:if="${error}">
    <span th:text="${error}"></span>
    <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Articles</h2>
    <a class="btn btn-primary" th:href="@{/admin/articles/nouveau}">
        <i class="bi bi-plus-circle"></i> Nouvel article
    </a>
</div>

<form class="mb-4" method="get" th:action="@{/admin/articles}">
    <input class="form-control" name="motCle" placeholder="Rechercher un article..." th:value="${motCle}" type="text">
</form>

<div class="row g-3">
    <div class="col-md-4" th:each="article : ${pageArticles.content}">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge bg-light text-dark" th:text="${article.categorieNom}"></span>
                    <span class="badge bg-success" th:if="${article.statut.name()=='PUBLIE'}">Publié</span>
                    <span class="badge bg-warning text-dark"
                          th:if="${article.statut.name()=='EN_ATTENTE'}">En attente</span>
                    <span class="badge bg-danger" th:if="${article.statut.name()=='REJETE'}">Rejeté</span>
                    <span class="badge bg-secondary" th:if="${article.statut.name()=='DESACTIVE'}">Désactivé</span>
                </div>
                <h5 class="card-title" th:text="${article.titre}"></h5>
                <p class="card-text text-muted small flex-grow-1"
                   th:text="${#strings.abbreviate(article.contenu, 110)}"></p>
                <p class="text-muted small mb-2"><i class="bi bi-person"></i> <span
                        th:text="${article.contributeurNom}"></span></p>
                <div class="d-flex flex-wrap gap-1">
                    <a class="btn btn-sm btn-success"
                       onclick="return confirm('Valider et publier cet article ?')"
                       th:href="@{'/admin/articles/approuver/' + ${article.id}}"
                       th:if="${article.statut.name()=='EN_ATTENTE'}" title="Valider">
                        <i class="bi bi-check-lg"></i>
                    </a>
                    <button class="btn btn-sm btn-outline-danger"
                            data-bs-target="#modalRejet" data-bs-toggle="modal"
                            th:if="${article.statut.name()=='EN_ATTENTE'}" th:onclick="'document.getElementById(\'formRejet\').action=\'/admin/articles/rejeter/' + ${article.id} + '\';'"
                            title="Rejeter"
                            type="button">
                        <i class="bi bi-x-lg"></i>
                    </button>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{'/admin/articles/' + ${article.id}}"
                       title="Voir">
                        <i class="bi bi-eye"></i>
                    </a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/articles/modifier/' + ${article.id}}"
                       title="Modifier">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer cet article ?')"
                       th:href="@{'/admin/articles/supprimer/' + ${article.id}}" title="Supprimer">
                        <i class="bi bi-trash"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <p class="text-muted" th:if="${pageArticles.empty}">Aucun article trouvé.</p>
</div>

<nav class="mt-4">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${pageArticles.first}? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/articles(page=${pageArticles.number-1}, motCle=${motCle})}">Précédent</a>
        </li>
        <li class="page-item" th:classappend="${i==pageArticles.number} ? 'active'"
            th:each="i : ${#numbers.sequence(0,pageArticles.totalPages-1)}">
            <a class="page-link" th:href="@{/admin/articles(page=${i}, motCle=${motCle})}" th:text="${i+1}"></a>
        </li>
        <li class="page-item" th:classappend="${pageArticles.last}? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/articles(page=${pageArticles.number+1}, motCle=${motCle})}">Suivant</a>
        </li>
    </ul>
</nav>

<div aria-hidden="true" class="modal fade" id="modalRejet" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="formRejet" method="post">
            <div class="modal-header">
                <h5 class="modal-title">Motif du rejet</h5>
                <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">Ce motif sera envoyé automatiquement au contributeur.</label>
                <textarea class="form-control" name="motif" placeholder="Expliquez pourquoi cet article est rejeté..." required
                          rows="4"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Annuler</button>
                <button class="btn btn-danger" type="submit">Rejeter et notifier</button>
            </div>
        </form>
    </div>
</div>
