<div class="alert alert-success alert-dismissible fade show" th:if="${success}">
    <span th:text="${success}"></span>
    <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
</div>
<div class="alert alert-danger alert-dismissible fade show" th:if="${error}">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span th:text="${error}"></span>
    <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Catégories</h2>
    <a class="btn btn-primary" th:href="@{/admin/categories/nouveau}">
        <i class="bi bi-plus-circle"></i> Nouvelle catégorie
    </a>
</div>

<div class="row g-3">
    <div class="col-md-3" th:each="categorie : ${pageCategories.content}">
        <div class="card folder-card h-100">
            <div class="card-body text-center py-4">
                <i class="bi bi-folder-fill folder-icon"></i>
                <h6 class="mt-3 mb-1" th:text="${categorie.nom}">Nom</h6>
                <small class="text-muted d-block"
                       th:text="${categorie.parentNom != null ? 'Sous-catégorie de ' + categorie.parentNom : 'Catégorie racine'}"></small>
                <span class="badge bg-light text-dark mt-2" th:text="${categorie.nombreArticles} + ' article(s)'">0 article(s)</span>
                <p class="text-muted small mt-2 mb-0" th:text="${categorie.description}"></p>
                <div class="d-flex justify-content-center gap-2 mt-3">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{'/admin/categories/modifier/' + ${categorie.id}}">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a class="btn btn-sm btn-outline-danger"
                       th:if="${categorie.nombreArticles == 0}"
                       th:href="@{'/admin/categories/supprimer/' + ${categorie.id}}"
                       onclick="return confirm('Supprimer cette catégorie ?')">
                        <i class="bi bi-trash"></i>
                    </a>
                    <button class="btn btn-sm btn-outline-secondary" disabled th:if="${categorie.nombreArticles > 0}"
                            title="Catégorie non vide">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <p class="text-muted" th:if="${pageCategories.empty}">Aucune catégorie créée pour le moment.</p>
</div>

<nav class="mt-4">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${pageCategories.first}? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${pageCategories.number-1})}">Précédent</a>
        </li>
        <li class="page-item" th:classappend="${i==pageCategories.number} ? 'active'"
            th:each="i : ${#numbers.sequence(0,pageCategories.totalPages-1)}">
            <a class="page-link" th:href="@{/admin/categories(page=${i})}" th:text="${i+1}"></a>
        </li>
        <li class="page-item" th:classappend="${pageCategories.last}? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${pageCategories.number+1})}">Suivant</a>
        </li>
    </ul>
</nav>
